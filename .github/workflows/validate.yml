{
  "name": "Validate",
  "on": {
    "pull_request": {
      "branches": [
        "development",
        "main"
      ]
    },
    "push": {
      "branches": [
        "development"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "validation": {
      "uses": "SpencerRWood/workflows/.github/workflows/validate.yml@9748b1cd6287d84d55c4277c93ca5dae01fb1787",
      "with": {
        "workflow_revision": "9748b1cd6287d84d55c4277c93ca5dae01fb1787"
      },
      "secrets": {
        "dbt_host": "${{ secrets.DBT_HOST }}",
        "dbt_user": "${{ secrets.DBT_USER }}",
        "dbt_password": "${{ secrets.DBT_PASSWORD }}",
        "dbt_port": "${{ secrets.DBT_PORT }}",
        "dbt_dbname": "${{ secrets.DBT_DBNAME }}",
        "dbt_schema": "${{ secrets.DBT_SCHEMA }}"
      }
    }
  }
}
